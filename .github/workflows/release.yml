name: Release

# Push a tag like v0.1.0 to build all apps and publish a GitHub Release.
# Run manually from the Actions tab to build without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets; APK is signed with a debug key and can't update a previous install."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - run: flutter build apk --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk Lt-${{ needs.version.outputs.name }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Lt-*-android.apk

  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}
      - name: Package DMG
        run: |
          mkdir dmg
          cp -R build/macos/Build/Products/Release/Lt.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Lt -srcfolder dmg -ov -format UDZO Lt-${{ needs.version.outputs.name }}-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Lt-*-macos.dmg

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release --build-name=${{ needs.version.outputs.name }} --build-number=${{ github.run_number }}
      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Lt-${{ needs.version.outputs.name }}-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Lt-*-windows.zip

  publish:
    if: github.ref_type == 'tag'
    needs: [version, android, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Lt ${{ needs.version.outputs.name }}" \
            --notes-file .github/release-notes.md \
            --generate-notes
